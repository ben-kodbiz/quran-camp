<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Come Back to Qur'an — 114 Surahs Interactive Reader</title>
  <style>
    :root {
      --bg-main: #0B0F17;
      --bg-card: #131A26;
      --bg-sidebar: #0E1420;
      --accent-gold: #C5A059;
      --accent-gold-light: #E5C384;
      --text-main: #E2E8F0;
      --text-muted: #94A3B8;
      --border-color: #232D3F;
      --arabic-font: 'Traditional Arabic', 'Amiri', 'Scheherazade New', serif;
    }
    
    
    [data-theme="midnight"] {
      --bg-main: #000000;
      --bg-card: #0A0F18;
      --bg-sidebar: #05080E;
      --accent-gold: #D4AF37;
      --accent-gold-light: #F3E5AB;
      --text-main: #F8FAFC;
      --text-muted: #64748B;
      --border-color: #1E293B;
    }

    body {
      --content-scale: 1rem;
    }
    body.font-sm { --content-scale: 0.88rem; }
    body.font-lg { --content-scale: 1.15rem; }
    body.font-xl { --content-scale: 1.3rem; }

    .section-card p, .section-card div pre {
      font-size: var(--content-scale);
    }

    [data-theme="parchment"] {
      --bg-main: #FBF9F4;
      --bg-card: #FFFFFF;
      --bg-sidebar: #F3EFE6;
      --accent-gold: #8B6B2B;
      --accent-gold-light: #B89243;
      --text-main: #1E293B;
      --text-muted: #64748B;
      --border-color: #E2D9C8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
      line-height: 1.6;
    }

    /* Sidebar */
    .sidebar {
      width: 380px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 20px;
      border-bottom: 1px solid var(--border-color);
    }

    .brand-title {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--accent-gold);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .search-box {
      margin-top: 14px;
      position: relative;
    }

    .search-input {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-input:focus {
      border-color: var(--accent-gold);
    }

    .filter-pills {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }

    .filter-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 4px 10px;
      font-size: 0.75rem;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn.active {
      background: var(--accent-gold);
      color: #0B0F17;
      font-weight: 600;
      border-color: var(--accent-gold);
    }

    .surah-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .surah-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 4px;
      transition: background 0.15s;
    }

    .surah-item:hover {
      background: rgba(197, 160, 89, 0.08);
    }

    .surah-item.active {
      background: rgba(197, 160, 89, 0.16);
      border-left: 3px solid var(--accent-gold);
    }

    .surah-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .surah-num {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--accent-gold-light);
    }

    .surah-name {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .surah-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .surah-ar {
      font-family: var(--arabic-font);
      font-size: 1.35rem;
      color: var(--accent-gold-light);
    }

    /* Main Content */
    .main-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg-main);
    }

    .top-bar {
      height: 60px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
      flex-shrink: 0;
      background: var(--bg-sidebar);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn:hover {
      border-color: var(--accent-gold);
      color: var(--accent-gold-light);
    }

    .btn.active-audio {
      background: var(--accent-gold);
      color: #000;
      font-weight: bold;
    }

    .content-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 40px 60px;
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
    }

    /* Chapter Presentation */
    .chapter-hero {
      text-align: center;
      margin-bottom: 40px;
      padding-bottom: 30px;
      border-bottom: 1px solid var(--border-color);
    }

    .badge-class {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(197, 160, 89, 0.12);
      color: var(--accent-gold);
      border: 1px solid var(--accent-gold);
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 14px;
    }

    .chapter-title-en {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .chapter-title-ar {
      font-family: var(--arabic-font);
      font-size: 2.8rem;
      color: var(--accent-gold-light);
      margin-bottom: 14px;
      line-height: 1.2;
    }

    .chapter-theme {
      font-size: 1.15rem;
      color: var(--text-muted);
      font-style: italic;
      max-width: 650px;
      margin: 0 auto;
    }

    .section-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px 28px;
      margin-bottom: 24px;
    }

    .section-title {
      font-size: 0.95rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent-gold);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .arabic-block {
      font-family: var(--arabic-font);
      font-size: 1.85rem;
      line-height: 2.2;
      text-align: right;
      color: var(--accent-gold-light);
      padding: 16px 20px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 8px;
      margin: 14px 0;
      border-right: 3px solid var(--accent-gold);
    }

    .action-box {
      background: rgba(197, 160, 89, 0.08);
      border-left: 4px solid var(--accent-gold);
      padding: 16px 20px;
      border-radius: 0 8px 8px 0;
      font-size: 1.05rem;
      font-weight: 500;
    }

    pre {
      white-space: pre-wrap;
      font-family: inherit;
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="brand-title">
        <span>📖</span> HUURS STUDIO
      </div>
      <div class="brand-sub">Come Back to Qur'an — 114 Surahs</div>
      
      <div class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="Search Surah, theme, or number...">
      </div>

      <div class="filter-pills">
        <button class="filter-btn active" data-filter="all">All (114)</button>
        <button class="filter-btn" data-filter="Makki">Makki</button>
        <button class="filter-btn" data-filter="Madani">Madani</button>
        <button class="filter-btn" data-filter="bookmarks" id="bookmarkFilterBtn">★ Saved (<span id="bookmarkCount">0</span>)</button>
      </div>
    </div>

    <div class="surah-list" id="surahList">
      <!-- Injected via JavaScript -->
    </div>
  </aside>

  <!-- Main View -->
  <main class="main-view">
    <header class="top-bar">
      <div id="topSurahInfo" style="font-weight: 600; color: var(--accent-gold);">
        Surah 1: Al-Fatihah
      </div>
      <div class="nav-actions" style="display: flex; gap: 8px; align-items: center;">
        <button id="bookmarkToggleBtn" class="btn" title="Save or bookmark this Surah">
          <span id="bookmarkIcon">☆</span> <span id="bookmarkText">Save</span>
        </button>
        <div style="display: inline-flex; border: 1px solid var(--border-color); border-radius: 6px; overflow: hidden;">
          <button id="fontDecBtn" class="btn" style="padding: 6px 10px; font-size: 0.8rem; border-radius: 0;" title="Smaller text">A-</button>
          <button id="fontResetBtn" class="btn" style="padding: 6px 10px; font-size: 0.8rem; border-radius: 0;" title="Default text">A</button>
          <button id="fontIncBtn" class="btn" style="padding: 6px 10px; font-size: 0.8rem; border-radius: 0;" title="Larger text">A+</button>
        </div>
        <button id="audioAmbienceBtn" class="btn">
          <span>🌧️</span> Ambient Rain
        </button>
        <button id="themeToggleBtn" class="btn">
          <span>🌓</span> <span id="themeName">Dark</span>
        </button>
      </div>
    </header>

    <div class="content-scroll" id="contentScroll">
      <!-- Chapter Content Injected via JS -->
    </div>
  </main>

  <script>
    const surahs = [{"num": 1, "name": "Al-Fatihah", "arabic": "الفاتحة", "classification": "Makki", "verses": 7, "theme": "The Essence of the Qur'an and Supplication for Divine Guidance", "why": "Surah Al-Fatihah is the singular surah without which no Islamic prayer (*salah*) is valid. A practicing believer recites it at least seventeen times every single day. Yet, precisely because of its immense familiarity, it is the surah most vulnerable to mechanical, heedless repetition. Understanding Al-Fatihah transforms your daily prayer from a routine ritual into an intimate, two-way conversation with the Creator of the universe.", "action": "**The Conscious Fatihah in Today’s Prayer:**  \nIn your very next prayer, recite Surah Al-Fatihah verse by verse, pausing for two full seconds after every single ayah. Mentally visualize the divine response in Hadith Qudsi before speaking the next line.", "tadabbur": "* **The Pauses in Prayer:** When you stand in prayer and recite Al-Fatihah, do you pause between verses to allow the divine response to echo in your heart? When you say *Al-Hamdulillahi Rabbil 'Alamin*, remember that at that exact fraction of a second, the Lord of the Throne announces to the angels: *My servant has praised Me.*\n* **The Universal Need for Guidance:** Notice what Allah instructed you to ask for. He did not instruct you to make wealth, health, or career your mandatory seventeen-times-a-day prayer. He made **guidance** mandatory. If you have everything in this world but lack guidance, you have lost everything. If you lose everything in this world but possess guidance, you have gained eternity.", "tafsir": "* **Ibn Kathir on *Umm al-Kitab*:** Ibn Kathir notes that Al-Fatihah is termed the \"Mother of the Qur'an\" because it encompasses all fundamental objectives of the revelation: affirming *Tawhid* (the oneness of Allah), establishing divine attributes of mercy and justice, affirming the Day of Reckoning (*Ma'ad*), establishing servitude (*Ibadah*), and asking for the guidance upon which salvation depends.\n* **The Pivot Point (Verse 5):** Classical commentators highlight that verse 5 (*Iyyāka na'budu wa iyyāka nasta'īn*) sits precisely at the center of the surah. Worship is mentioned before seeking assistance because performing worship is Allah’s right, while granting help is Allah’s grace upon His servant.\n* **The Nature of the Straight Path (*Al-Sirat al-Mustaqim*):** As-Suddi, Ibn Abbas, and Ali ibn Abi Talib (رضي الله عنهم) explained that the Straight Path is the Book of Allah and Islam itself—a highway that is clear, wide, and leads directly to divine pleasure without deviations.", "passages": "<div class='arabic-block'>بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ (1) الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ (2) الرَّحْمَٰنِ الرَّحِيمِ (3) مَالِكِ يَوْمِ الدِّينِ (4) إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ (5) اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ (6) صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ (7)</div>", "dua": "<div class='arabic-block'>اللَّهُمَّ اهْدِنَا فِيمَنْ هَدَيْتَ ، وَعَافِنَا فِيمَنْ عَافَيْتَ ، وَتَوَلَّنَا فِيمَنْ تَوَلَّيْتَ</div>  \n*\"O Allah, guide us among those whom You have guided, grant us well-being among those whom You have granted well-being, and take us into Your care among those whom You have taken into Your care. Amin.\"*"}, {"num": 2, "name": "Al-Baqarah", "arabic": "البقرة", "classification": "Madani", "verses": 286, "theme": "Establishing Guidance, Law, Covenant, and Complete Submission to Allah", "why": "Surah Al-Baqarah is the fortress of the Muslim home. The Prophet ﷺ described it as the highest peak of the Qur'an. Containing the greatest verse in the revelation—*Ayat al-Kursi* (2:255)—and concluding with the two blessed verses gifted during the Miraculous Ascension (*Al-Isra wal-Mi'raj*), it addresses every dimension of human existence: personal belief, moral discipline, financial justice, marital peace, and communal devotion.", "action": "**Establish the Nighttime Shield:**  \nBeginning tonight, make it an unbroken habit to recite the final two verses of Surah Al-Baqarah (*Amanar-Rasulu* 2:285–286) immediately before closing your eyes to sleep.", "tadabbur": "* **The Cow Within:** The Israelites delayed slaughtering the cow because they had previously worshipped the golden calf. The love of the idol had saturated their hearts (2:93). When Allah commands you to give up an impermissible habit, ask yourself: *What hidden idol am I hesitating to sacrifice?*\n* **The Direct Call:** When you read verse 186—where Allah promises that He is near—remember that this promise sits immediately after the verses of Ramadan, fasting, and rules. It reminds you: all divine laws exist solely to bring you back into intimate nearness with Him.", "tafsir": "* **The Tripartite Human Landscape (Verses 1–20):** Ibn Kathir notes that the surah begins by dividing all of humanity into three psychological states: the true Believers (*Al-Mu'minun*, 4 verses), the overt Disbelievers (*Al-Kafirun*, 2 verses), and the subtle, dangerous Hypocrites (*Al-Munafiqun*, 13 verses). This uneven distribution emphasizes that internal spiritual inconsistency is the most destructive threat to the human heart.\n* **The Tragedy of Hesitation (The Story of the Cow):** Classical mufassirun explain why the surah is named after the Cow (*Al-Baqarah*). When ordered by Allah to sacrifice a simple cow, the Children of Israel hesitated, questioned excessively, and sought irrelevant complications instead of submitting with willing hearts. The surah warns the Muslim community: *Do not overcomplicate your surrender to Allah.*\n* **The Prohibition of Usury (Riba) vs. Charity (Sadaqah):** Towards the climax of the surah (2:275–281), Allah sets forth the absolute moral contrast between economic greed that exploits human suffering (*riba*) and selfless charity that revives society (*sadaqah*).", "passages": "1. **The Divine Protection (Ayat al-Kursi 2:255):**  \n   <div class='arabic-block'>اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ...</div>  \n   *\"Allah! There is no deity ˹worthy of worship˺ except Him, the Ever-Living, All-Sustaining. Neither drowsiness nor sleep overtakes Him...\"*\n2. **The Nearness of Allah (2:186):**  \n   <div class='arabic-block'>وَإِذَا سَأَلَكَ عِبَادِي عَنِّي فَإِنِّي قَرِيبٌ...</div>  \n   *\"When My servants ask you concerning Me: I am indeed near...\"*\n3. **The Covenant of Faith & Relief from Burdens (2:285–286):**  \n   <div class='arabic-block'>لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا ۚ لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا اكْتَسَبَتْ...</div>  \n   *\"Allah does not burden a soul beyond its capacity...\"*", "dua": ""}, {"num": 3, "name": "Ali 'Imran", "arabic": "آل عمران", "classification": "Madani", "verses": 200, "theme": "Steadfastness upon Truth, Purification of Intention, and Firmness Through Trials", "why": "If Surah Al-Baqarah establishes the foundation of divine law and the covenant with Allah, Surah Ali 'Imran teaches the believer how to remain **steadfast** (*thabat*) when that faith is challenged. Whether facing intellectual confusion, spiritual wavering, or the devastating emotional shock of physical loss (as occurred at the Battle of Uhud), Ali 'Imran provides the soul with unshakeable stability.", "action": "**Adopt the Prophetic Firmness Supplication:**  \nIn every single prayer today, recite the supplication of the rooted scholars (3:8) during your final prostration (*sujud*):  \n$$\\text{رَبَّنَا لَا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِن لَّدُنكَ رَحْمَةً ۚ إِنَّكَ أَنتَ الْوَهَّابُ}$$", "tadabbur": "* **The Fragility of the Heart:** If the scholars of profound knowledge (*Al-Rasikhuna fil-'Ilm*) fear deviation and beg Allah: *Do not let our hearts deviate*, why are we so casually confident in our spiritual safety?\n* **Looking at the Night Sky:** The next time you step outside under the stars, pause. Do not look at the sky as empty space. Look at it as the Prophet ﷺ did in Surah Ali 'Imran 3:190: as a staggering monument to divine intelligence, whispering to your soul: *Our Lord, You did not create this in vain.*", "tafsir": "* **The Rooted in Knowledge (*Al-Rasikhuna fil-'Ilm*):** Ibn Kathir explains that in the opening of the surah (3:7), Allah reveals that the Qur'an contains verses that are entirely clear (*Muhkamat*) and others whose ultimate realities are subtle (*Mutashabihat*). Those with deviation in their hearts pursue ambiguity to create division, whereas the truly learned say: *“We believe in all of it; all is from our Lord.”* And they immediately follow this humility with the supplication: *“Our Lord! Do not let our hearts deviate after You have guided us.”*\n* **Gentleness as Divine Grace (Verse 159):** Even after the catastrophic tactical disobedience at Uhud that led to seventy companions being martyred, Allah commanded the Prophet ﷺ to forgive them, consult them, and treat them with mercy. Mufti Shafi notes in *Ma'arif-ul-Qur'an* that spiritual leadership is founded upon forbearance, not vindictiveness.", "passages": "1. **The Supplication of the Deeply Rooted in Knowledge (3:8):**  \n   <div class='arabic-block'>رَبَّنَا لَا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِن لَّدُنكَ رَحْمَةً ۚ إِنَّكَ أَنتَ الْوَهَّابُ</div>  \n   *\"Our Lord! Do not let our hearts deviate after You have guided us. Grant us Your mercy. You are indeed the Giver of all bounties.\"*\n2. **The Antidote to Despair (3:139):**  \n   <div class='arabic-block'>وَلَا تَهِنُوا وَلَا تَحْزَنُوا وَأَنتُمُ الْأَعْلَوْنَ إِن كُنتُم مُّؤْمِنِينَ</div>  \n   *\"Do not falter or grieve, for you will have the upper hand if you are ˹true˺ believers.\"*\n3. **The Night Contemplation of the People of Understanding (3:190–191):**  \n   <div class='arabic-block'>إِنَّ فِي خَلْقِ السَّمَاوَاتِ وَالْأَرْضِ وَاخْتِلَافِ اللَّيْلِ وَالنَّهَارِ لَآيَاتٍ لِّأُولِي الْأَلْبَابِ (190) الَّذِينَ يَذْكُرُونَ اللَّهَ قِيَامًا وَقُعُودًا وَعَلَىٰ جُنُوبِهِمْ وَيَتَفَكَّرُونَ فِي خَلْقِ السَّمَاوَاتِ وَالْأَرْضِ رَبَّنَا مَا خَلَقْتَ هَٰذَا بَاطِلًا سُبْحَانَكَ فَقِنَا عَذَابَ النَّارِ (191)</div>", "dua": ""}, {"num": 4, "name": "An-Nisa", "arabic": "النساء", "classification": "Madani", "verses": 176, "theme": "Justice, Protection of the Vulnerable, Sacred Trusts, and Moral Integrity", "why": "Surah An-Nisa is the great charter of divine justice and compassion for the vulnerable. While worldly societies routinely exploit the weak, the orphan, and the disadvantaged, Surah An-Nisa places the protection of vulnerable souls at the very center of spiritual life. It reminds humanity that true worship is not proven in isolated rituals, but in how we handle power, family trusts, financial integrity, and justice.", "action": "**Fulfill a Neglected Trust Today:**  \nReview your financial and personal affairs today. Is there an unpaid debt, an unreturned borrowed item, or a withheld apology owed to someone under your authority? Fulfill it before the day ends.", "tadabbur": "* **The Tear of Accountability:** When the Prophet ﷺ cried upon hearing verse 4:41, he was contemplating standing as a witness over humanity before Allah. If the most beloved of creation trembled at divine accountability, how can we casually overlook how we treat employees, spouses, or the weak under our care?\n* **Justice Against the Ego:** It is easy to demand justice when someone wrongs us. But can we testify honestly when our own mistake caused the harm? Verse 4:135 calls you to stand as a witness *against yourself*. That is the true death of pride.", "tafsir": "* **The Universal Family (*Nafs Wahidah*):** Ibn Kathir notes that the surah begins with an all-encompassing address to all humanity (*Ya ayyuhan-nas*), reminding mankind that they originate from a single soul (Adam). From this shared root springs the moral obligation of mutual mercy, family ties (*arham*), and the prohibition of tribal tyranny.\n* **Uncompromising Justice (Verse 135):** Ibn Kathir emphasizes the phrasing *Qawwāmīna bil-qist*—not merely being just when convenient, but actively championing equity even when the truth harms your personal wealth, your reputation, or your closest family members. A believer never bends testimony to favor a rich ally or pity a poor opponent; justice belongs to Allah alone.", "passages": "1. **The Common Origin of Humanity (4:1):**  \n   <div class='arabic-block'>يَا أَيُّهَا النَّاسُ اتَّقُوا رَبَّكُمُ الَّذِي خَلَقَكُم مِّن نَّفْسٍ وَاحِدَةٍ وَخَلَقَ مِنْهَا زَوْجَهَا وَبَثَّ مِنْهُمَا رِجَالًا كَثِيرًا وَنِسَاءً...</div>  \n   *\"O humanity! Be mindful of your Lord Who created you from a single soul, and from it created its mate, and through both spread countless men and women...\"*\n2. **The Command to Render Trusts and Judge with Justice (4:58):**  \n   <div class='arabic-block'>إِنَّ اللَّهَ يَأْمُرُكُمْ أَن تُؤَدُّوا الْأَمَانَاتِ إِلَىٰ أَهْلِهَا وَإِذَا حَكَمْتُم بَيْنَ النَّاسِ أَن تَحْكُمُوا بِالْعَدْلِ</div>  \n   *\"Indeed, Allah commands you to return trusts to their rightful owners; and when you judge between people, judge with justice.\"*\n3. **Upholding Justice Against Oneself (4:135):**  \n   <div class='arabic-block'>يَا أَيُّهَا الَّذِينَ آمَنُوا كُونُوا قَوَّامِينَ بِالْقِسْطِ شُهَدَاءَ لِلَّهِ وَلَوْ عَلَىٰ أَنفُسِكُمْ أَوِ الْوَالِدَيْنِ وَالْأَقْرَبِينَ</div>  \n   *\"O believers! Stand firm for justice as witnesses for Allah, even if it is against yourselves, your parents, or your close relatives...\"*", "dua": ""}, {"num": 5, "name": "Al-Ma'idah", "arabic": "المائدة", "classification": "Madani", "verses": 120, "theme": "Fidelity to Covenants, Universal Justice, and Preservation of Divine Boundaries", "why": "Surah Al-Ma'idah is the Qur'anic masterpiece on covenants, moral consistency, and societal integrity. It is one of the very last major surahs revealed to the Prophet Muhammad ﷺ, containing definitive instructions on religious obligations, halal and haram, social cooperation, the rule of law, and fair treatment toward all people. If Surah An-Nisa protected the vulnerable within the family and society, Surah Al-Ma'idah establishes the inviolable covenants that hold an entire civilization together—affirming that a believer's word is sacred, human life is priceless, and justice must never yield to personal malice.", "action": "**Audit Your Promises and Agreements Today:**  \nReview the commitments you have made to your family, employer, business partners, or friends. Is there an unfulfilled deadline, a neglected contract clause, or a broken promise? Contact them today, acknowledge it, and make it right.", "tadabbur": "* **The Weight of Your Word:** We live in a culture where promises are broken at the slightest inconvenience, contracts are renegotiated through loopholes, and words are cheapened. Surah Al-Ma'idah opens with three words: *Awfū bil-'Uqūd*—*Honor your contracts.* When you give your word to someone, you bring Allah as a witness over that promise. How sacred is your word today?\n* **Fairness Under Provocation:** Anyone can be polite to a friend. The real test of your faith is whether you can be fair to someone you dislike. Verse 5:8 challenges you: When someone insults you, undermines you, or disagrees with you, can you still judge them with total equity?", "tafsir": "* **The Scope of *Al-'Uqud* (The Covenants):** Ibn Kathir and classical commentators emphasize that verse 5:1 encompasses all covenants: covenants between the servant and the Creator (faith, prayers, vows, halal and haram), covenants between individuals (contracts, debts, marriages, business partnerships), and covenants between nations (treaties and peace accords). In Islam, breaching a contract is not merely a legal failure; it is a spiritual betrayal.\n* **Justice Against Your Opponents (Verse 5:8):** Imam al-Qurtubi and Ibn Kathir underscore the radical moral standard of verse 5:8: Even if an adversary has wronged you, insulted you, or waged war against you, you are divinely prohibited from treating them unjustly in return. Personal grievances must never bend the scales of objective justice.\n* **The Feast of the Disciples (The Naming of the Surah):** The surah takes its name from verses 112–115, where the disciples asked Prophet Isa (Jesus, peace be upon him) for a table spread (*Ma'idah*) sent down from heaven as a sign. Ibn Kathir notes that physical miracles increase accountability: receiving undeniable signs demands unwavering sincerity, and the ultimate salvation belongs to the truthful (*as-sadiqin*).", "passages": "1. **The Inviolability of Covenants (5:1):**  \n   <div class='arabic-block'>يَا أَيُّهَا الَّذِينَ آمَنُوا أَوْفُوا بِالْعُقُودِ</div>  \n   *\"O believers! Honor your contracts and obligations...\"*\n2. **Mutual Cooperation in Goodness, Never in Sin (5:2):**  \n   <div class='arabic-block'>وَتَعَاوَنُوا عَلَى الْبِرِّ وَالتَّقْوَىٰ ۖ وَلَا تَعَاوَنُوا عَلَى الْإِثْمِ وَالْعُدْوَانِ ۚ وَاتَّقُوا اللَّهَ</div>  \n   *\"Cooperate with one another in goodness and righteousness, and do not cooperate in sin and transgression. And be mindful of Allah...\"*\n3. **The Perfection of the Deen (5:3):**  \n   <div class='arabic-block'>الْيَوْمَ أَكْمَلْتُ لَكُمْ دِينَكُمْ وَأَتْمَمْتُ عَلَيْكُمْ نِعْمَتِي وَرَضِيتُ لَكُمُ الْإِسْلَامَ دِينًا</div>  \n   *\"Today I have perfected your religion for you, completed My favor upon you, and have chosen Islam as your religion.\"*\n4. **Justice Transcending Hatred (5:8):**  \n   <div class='arabic-block'>يَا أَيُّهَا الَّذِينَ آمَنُوا كُونُوا قَوَّامِينَ لِلَّهِ شُهَدَاءَ بِالْقِسْطِ ۖ وَلَا يَجْرِمَنَّكُمْ شَنَآنُ قَوْمٍ عَلَىٰ أَلَّا تَعْدِلُوا ۚ اعْدِلُوا هُوَ أَقْرَبُ لِلتَّقْوَىٰ</div>  \n   *\"O believers! Stand firm for Allah and bear true testimony. Do not let the hatred of a people lead you to injustice. Be just! That is closer to righteousness...\"*\n5. **The Universal Sanctity of Human Life (5:32):**  \n   <div class='arabic-block'>مَن قَتَلَ نَفْسًا بِغَيْرِ نَفْسٍ أَوْ فَسَادٍ فِي الْأَرْضِ فَكَأَنَّمَا قَتَلَ النَّاسَ جَمِيعًا وَمَنْ أَحْيَاهَا فَكَأَنَّمَا أَحْيَا النَّاسَ جَمِيعًا</div>  \n   *\"Whoever kills a soul unless for a soul or for corruption [done] in the land—it is as if he had slain mankind entirely. And whoever saves one—it is as if he had saved mankind entirely.\"*", "dua": ""}, {"num": 6, "name": "Al-An'am", "arabic": "الأنعام", "classification": "Makki", "verses": 165, "theme": "Decisive Proofs of Tawhid, Cosmic Contemplation, and the Moral Integrity of the Straight Path", "why": "Surah Al-An'am is the grandest theological manifesto in the Qur'an. While the preceding four long surahs (Al-Baqarah, Ali 'Imran, An-Nisa, and Al-Ma'idah) established the legal, social, and moral structures of the Muslim community in Madinah, Surah Al-An'am transports the reader back to the fiery dawn of Makkah. It sweeps away superstition, philosophical skepticism, and idol worship, inviting the human mind to look at the universe with wide-eyed awe. In an era dominated by materialism and spiritual apathy, Surah Al-An'am reawakens our recognition of the living Creator behind every heartbeat, every falling leaf, and every star in the night sky.", "action": "**Engage in 10 Minutes of Cosmic Tafakkur Today:**  \nStep outside after sunset or at dawn. Look up at the sky, a tree, or the horizon. Put away your phone. Recite verses 6:59 or 6:162 quietly, and consciously acknowledge the majestic presence of the Creator of the universe.", "tadabbur": "* **The Falling Leaf and Your Heart:** Walk outside and look at a tree in the wind. A yellow leaf breaks from its branch and falls to the soil. Allah saw it. Allah calculated its descent. Allah knew where it would land. If a single dried leaf does not fall without His knowledge and permission, do you truly believe your grief, your illness, your anxiety, or your sleepless night is unnoticed by Him?\n* **My Life and My Death for Allah (6:162):** We often compartmentalize our existence: one hour for Friday prayer, and the rest of the week for worldly ambition. Verse 6:162 shatters this divide: *“Surely my prayer, my sacrifice, my life, and my death belong to Allah.”* Eating can become worship with the right intention. Honest work can become worship. Playing with your children can become worship. Living is worship.", "tafsir": "* **The Omniscience of the Creator (Verse 59):** Ibn Kathir writes that verse 6:59 is among the most awe-inspiring verses describing divine knowledge. If Allah knows every single leaf that falls across all the continents, forests, and oceans of the earth—whether in broad daylight or pitch darkness—how could He ever be unaware of the tears in your eyes, the quiet prayer in your heart, or the secret oppression of a tyrant?\n* **Prophet Ibrahim’s Method of Argumentation (Verses 75–79):** Classical scholars like Fakhr al-Din ar-Razi clarify that Ibrahim (peace be upon him) was not an idolater transitioning through planets; he was using a masterclass in philosophical debate (*al-munazarah*) with his pagan society. By showing that stars, the moon, and the sun all rise and set (*la uhibbu al-afilin*—\"I love not things that set\"), he demonstrated that anything transient, dependent, and changing cannot be divine. Only the Eternal Maker deserves adoration.\n* **The Universal Foundation of Morality (Verses 151–153):** Abdullah ibn Abbas referred to these verses as *Muhkamah* (definitive law): they forbid shirk, mandate kindness to parents, ban infanticide and murder, protect orphans' assets, establish fair trade weights, command honest speech, and mandate following the single Straight Path.", "passages": "1. **The Keys of the Unseen and the Falling Leaf (6:59):**  \n   <div class='arabic-block'>وَعِندَهُ مَفَاتِحُ الْغَيْبِ لَا يَعْلَمُهَا إِلَّا هُوَ ۚ وَيَعْلَمُ مَا فِي الْبَرِّ وَالْبَحْرِ ۚ وَمَا تَسْقُطُ مِن وَرَقَةٍ إِلَّا يَعْلَمُهَا وَلَا حَبَّةٍ فِي ظُلُمَاتِ الْأَرْضِ وَلَا رَطْبٍ وَلَا يَابِسٍ إِلَّا فِي كِتَابٍ مُّبِينٍ</div>  \n   *\"With Him are the keys of the unseen—none knows them except Him. And He knows what is on the land and in the sea. Not a leaf falls but that He knows it, nor a grain in the darkness of the earth, nor anything moist or dry, but is [inscribed] in a clear record.\"*\n2. **Ibrahim's Search for the Eternal Creator (6:79):**  \n   <div class='arabic-block'>إِنِّي وَجَّهْتُ وَجْهِيَ لِلَّذِي فَطَرَ السَّمَاوَاتِ وَالْأَرْضَ حَنِيفًا ۖ وَمَا أَنَا مِنَ الْمُشْرِكِينَ</div>  \n   *\"Indeed, I have turned my face toward Him who originated the heavens and the earth, being upright, and I am not of the polytheists.\"*\n3. **The Ten Universal Commandments and the Straight Path (6:151–153):**  \n   <div class='arabic-block'>قُلْ تَعَالَوْا أَتْلُ مَا حَرَّمَ رَبُّكُمْ عَلَيْكُمْ ۖ أَلَّا تُشْرِكُوا بِهِ شَيْئًا ۖ وَبِالْوَالِدَيْنِ إِحْسَانًا... وَأَنَّ هَٰذَا صِرَاطِي مُسْتَقِيمًا فَاتَّبِعُوهُ ۖ وَلَا تَتَّبِعُوا السُّبُلَ فَتَفَرَّقَ بِكُمْ عَن سَبِيلِهِ</div>  \n   *\"Say: 'Come, I will recite what your Lord has forbidden to you: Do not associate anything with Him, and be good to parents... And [moreover], this is My path, which is straight, so follow it; and do not follow other ways, for they will separate you from His way.'\"*", "dua": ""}, {"num": 7, "name": "Al-A'raf", "arabic": "الأعراف", "classification": "Makki", "verses": 206, "theme": "The Primordial Covenant, Catastrophe of Pride, and Triumph of Humble Repentance", "why": "Surah Al-A'raf is the grand epic of human origin, human destiny, and the psychological battle between arrogance and humility. It reveals that long before our earthly birth, every single human soul testified before Allah to His divine Lordship. It sets side-by-side the two eternal responses to moral failure: the arrogant rebellion of Iblis (who justified his sin, claimed ethnic superiority, and blamed Allah) versus the broken humility of Adam and Eve (who immediately owned their mistake and pleaded for forgiveness). For anyone wrestling with ego, moral complacency, or spiritual stagnation, Surah Al-A'raf serves as a mirror showing where we stand on the high wall between Paradise and ruin.", "action": "**Make Adam's Dua Part of Your Daily Routine:**  \nMemorize and recite verse 7:23 after your prayers today:  \n$$\\text{رَبَّنَا ظَلَمْنَا أَنفُسَنَا وَإِن لَّمْ تَغْفِرْ لَنَا وَتَرْحَمْنَا لَنَكُونَنَّ مِنَ الْخَاسِرِينَ}$$  \nConsciously bring to mind one specific error you committed recently, acknowledge it before Allah without making excuses, and ask for His covering mercy.", "tadabbur": "* **Whose Response Do You Embody?** When you are caught in an error, confronted with a mistake, or advised to change:  \n  Do you respond like Iblis—defensive, rationalizing, arguing why you are superior, blaming your circumstances?  \n  Or do you drop to your knees like Adam and Hawwa: *Rabbana zalamna anfusana*—*‘Our Lord, we have wronged ourselves’*?  \n  The difference between a demon and a prophet is not that one never made a mistake; it is how they responded to their mistake.\n* **The Silence that Welcomes Mercy (7:204):** Notice the conditional phrasing: *“Listen attentively and remain silent so that you may receive mercy.”* If we talk over the Qur'an, play it as mere background noise while arguing, or let our thoughts drift while it is recited, we block the vessel of mercy. Silence is the soil in which revelation takes root.", "tafsir": "* **The Root of Racism and Pride (Verse 12):** Ibn Kathir and classical scholars highlight the reasoning of Iblis when commanded to bow: *‘I am better than him: You created me from fire and created him from clay.’* This was the first sin committed in existence, rooted in *Qiyas* (false analogical deduction) and racial supremacy. Iblis judged value based on substance rather than divine honor and obedience.\n* **The People of the Heights (*Ashab al-A'raf*, Verses 46–49):** Ibn Kathir records that the inhabitants of Al-A'raf are those whose good deeds and bad deeds were equal in weight. They are placed on an elevated barrier overlooking both Paradise and Hell. When they look toward the dwellers of Paradise, they greet them with hopeful longing; when their gaze turns toward the fire, they seek refuge in Allah from being among the wrongdoers. In the end, Allah’s mercy admits them to Paradise.\n* **The Universal Fitrah (Verse 172):** Classical mufassirun explain that the testimony taken from the souls (*Al-Mithaq*) is the metaphysical origin of the human conscience (*Fitrah*). No human being is born a blank slate; every soul holds an imprinted memory of divine majesty, which is why truth resonates when hearing authentic revelation.", "passages": "1. **The Primordial Covenant of All Souls (7:172):**  \n   <div class='arabic-block'>وَإِذْ أَخَذَ رَبُّكَ مِن بَنِي آدَمَ مِن ظُهُورِهِمْ ذُرِّيَّتَهُمْ وَأَشْهَدَهُمْ عَلَىٰ أَنفُسِهِمْ أَلَسْتُ بِرَبِّكُمْ ۖ قَالُوا بَلَىٰ ۛ شَهِدْنَا ۛ أَن تَقُولُوا يَوْمَ الْقِيَامَةِ إِنَّا كُنَّا عَنْ هَٰذَا غَافِلِينَ</div>  \n   *\"And [mention] when your Lord took from the children of Adam—from their loins—their descendants and made them testify over themselves, [saying to them], 'Am I not your Lord?' They said, 'Yes, we have testified.' [This] - lest you should say on the day of Resurrection, 'Indeed, we were of this unaware.'\"*\n2. **The Contrast of Adam's Humility (7:23):**  \n   <div class='arabic-block'>قَالَا رَبَّنَا ظَلَمْنَا أَنفُسَنَا وَإِن لَّمْ تَغْفِرْ لَنَا وَتَرْحَمْنَا لَنَكُونَنَّ مِنَ الْخَاسِرِينَ</div>  \n   *\"They said, 'Our Lord, we have wronged ourselves, and if You do not forgive us and have mercy upon us, we will surely be among the losers.'\"*\n3. **The Call to Attentive Listening and Silent Dhikr (7:204–205):**  \n   <div class='arabic-block'>وَإِذَا قُرِئَ الْقُرْآنُ فَاسْتَمِعُوا لَهُ وَأَنصِتُوا لَعَلَّكُمْ تُرْحَمُونَ (204) وَاذْكُر رَّبَّكَ فِي نَفْسِكَ تَضَرُّعًا وَخِيفَةً وَدُونَ الْجَهْرِ مِنَ الْقَوْلِ بِالْغُدُوِّ وَالْآصَالِ وَلَا تَكُن مِّنَ الْغَافِلِينَ (205)</div>  \n   *\"When the Quran is recited, listen to it attentively and be silent so that you may receive mercy. And remember your Lord within yourself in humility and in fear without being loud in speech—in the mornings and the evenings. And do not be of the heedless.\"*", "dua": ""}, {"num": 8, "name": "Al-Anfal", "arabic": "الأنفال", "classification": "Madani", "verses": 75, "theme": "True Reliance (Tawakkul), Victory Dynamics of Badr, and Answering the Call to Life", "why": "Surah Al-Anfal is the definitive masterclass on spiritual reliance (*tawakkul*), moral solidarity, and the unseen divine assistance that aids those who stand for truth against impossible odds. Named *Surat Badr* by the companions, it deconstructs the illusion of human self-sufficiency. When 313 poorly armed believers faced a haughty army of a thousand warriors at the wells of Badr, victory was not determined by weapons, wealth, or tactical superiority; it was decided by hearts purified of greed, united in brotherhood, and reliant upon the Almighty. For every believer facing daunting worldly obstacles, Surah Al-Anfal teaches that outer effort must be anchored in inner surrender.", "action": "**Eliminate One Point of Discord Today:**  \nIdentify a relationship with a fellow believer, family member, or friend where tension or bickering exists. Follow the command of 8:46: reach out, extend an apology or a peaceful greeting, and refuse to let Shaytan use division to weaken your spiritual courage.", "tadabbur": "* **The 313 Mindset:** How often do we look at our problems and feel utterly outnumbered? Your bills, your workload, your temptations, the spiritual climate of the world. Surah Al-Anfal tells you: You don't need a thousand allies. You need the favor of the One who controls the thousands. If Allah is with you, 313 can overcome an army.\n* **The Fragility of the Heart (8:24):** *“Know that Allah intervenes between a man and his heart.”* You do not own your heart. The fact that you feel love for prayer today is a gift that could be taken tomorrow if arrogance creeps in. Every heartbeat is rented from Allah.", "tafsir": "* **The Handful of Dust (Verse 17):** Ibn Kathir and the classical biographers record that during the height of the clash at Badr, the Prophet ﷺ took a handful of small pebbles and dust, turned toward the Qurayshi lines, and threw it saying: *Shahatil-wujuh!* (\"May these faces be disgraced!\"). By divine decree, that single handful of dust reached the eyes of every single warrior in the enemy ranks, causing instant blindness and panic. Allah reminded the Prophet ﷺ: the physical act of throwing was yours, but the supernatural reach and consequence was entirely Ours.\n* **The Call to Life (Verse 24):** Classical scholars like Imam al-Ghazali and Ibn al-Qayyim explain that people assume revelation restricts their freedom and burdens their life. But Allah asserts: *Liman yuhyīkum*—revelation is the very water of life for the soul! A person living in ignorance without the Qur'an is biologically breathing, but spiritually deceased.\n* **Allah Between a Man and His Heart (Verse 24):** Mujahid and Ibn Kathir comment: Allah controls the hearts of His servants; He can guide a heart that was once hard, or seal a heart that persistently turns away from truth. Therefore, the believer never relies on their own perceived piety; they continuously beg Allah for steadfastness.", "passages": "1. **The Qualities of the True Believers (8:2):**  \n   <div class='arabic-block'>إِنَّمَا الْمُؤْمِنُونَ الَّذِينَ إِذَا ذُكِرَ اللَّهُ وَجِلَتْ قُلُوبُهُمْ وَإِذَا تُلِيَتْ عَلَيْهِمْ آيَاتُهُ زَادَتْهُمْ إِيمَانًا وَعَلَىٰ رَبِّهِمْ يَتَوَكَّلُونَ</div>  \n   *\"The believers are only those who, when Allah is mentioned, their hearts tremble with awe, and when His verses are recited to them, it increases them in faith; and upon their Lord they rely.\"*\n2. **The Unseen Hand of Allah (8:17):**  \n   <div class='arabic-block'>فَلَمْ تَقْتُلُوهُمْ وَلَٰكِنَّ اللَّهَ قَتَلَهُمْ ۚ وَمَا رَمَيْتَ إِذْ رَمَيْتَ وَلَٰكِنَّ اللَّهَ رَمَىٰ</div>  \n   *\"And you did not kill them, but it was Allah who killed them. And you threw not, [O Muhammad], when you threw, but it was Allah who threw...\"*\n3. **Answering the Call that Gives Life (8:24):**  \n   <div class='arabic-block'>يَا أَيُّهَا الَّذِينَ آمَنُوا اسْتَجِيبُوا لِلَّهِ وَلِلرَّسُولِ إِذَا دَعَاكُمْ لِمَا يُحْيِيكُمْ ۖ وَاعْلَمُوا أَنَّ اللَّهَ يَحُولُ بَيْنَ الْمَرْءِ وَقَلْبِهِ</div>  \n   *\"O you who have believed! Respond to Allah and to the Messenger when he calls you to that which gives you life. And know that Allah intervenes between a man and his heart, and that to Him you will be gathered.\"*\n4. **The Danger of Internal Disputes (8:46):**  \n   <div class='arabic-block'>وَأَطِيعُوا اللَّهَ وَرَسُولَهُ وَلَا تَنَازَعُوا فَتَفْشَلُوا وَتَذْهَبَ رِيحُكُمْ ۖ وَاصْبِرُوا ۚ إِنَّ اللَّهَ مَعَ الصَّابِرِينَ</div>  \n   *\"And obey Allah and His Messenger, and do not dispute with one another, lest you lose courage and your strength departs. And be patient. Surely Allah is with the patient.\"*", "dua": ""}, {"num": 9, "name": "At-Tawbah", "arabic": "التوبة", "classification": "Madani", "verses": 129, "theme": "Demands of Radical Sincerity, Pardoning of the Three Who Procrastinated, and Standing with the Truthful", "why": "Surah At-Tawbah is the ultimate confrontation with self-deception. It strips away pious excuses, half-hearted commitments, and the false comfort of doing \"just enough.\" While it is known for lacking the opening *Basmalah*—beginning with a thunderous declaration of divine disavowal against treachery—its climax contains one of the most tender narratives in human history: the story of the three believers who procrastinated, owned their failure with total honesty, endured agonizing social isolation, and received divine pardon directly from the heavens. Surah At-Tawbah teaches us that Allah does not demand flawlessness; He demands uncompromising truthfulness.", "action": "**Own a Hidden Failure Today:**  \nIs there an area in your spiritual life where you have been pretending everything is fine while knowing you are slipping? Drop the facade tonight. Sit in your room, confess your shortcoming to Allah with Ka'b's radical honesty, and beg Him: *Thumma tub 'alayya li-atub* (\"Turn to me, Ya Allah, that I may turn to You\").", "tadabbur": "* **The Comfort of Excuses:** When eighty hypocrites came with smooth explanations for missing Tabuk, the Prophet ﷺ let them go. Ka'b ibn Malik could have easily fabricated an illness or business emergency. But he chose 50 days of public humiliation over an eternity of hypocrisy. He traded his pride for his soul. When you make a mistake, do you invent polite excuses, or do you have the courage to say: *‘I was lazy. I made a bad choice. Forgive me’*?\n* **The Cry from the Mountain (9:118):** On the fiftieth morning, as Ka'b was praying Fajr on the roof of his house, weeping with a constricted heart, a rider galloped to the top of Mount Sal' and screamed at the top of his lungs: *“O Ka'b ibn Malik, receive glad tidings!”* Ka'b fell into prostration in tears. Allah had pardoned him in the eternal Qur'an, read until the end of time. Truthfulness may cause temporary pain, but its fruit is eternal honor.", "tafsir": "* **Why No Basmalah?** Ibn Kathir records that Uthman ibn Affan and Ali ibn Abi Talib explained: The *Basmalah* is an emblem of safety and peace, whereas Surah At-Tawbah descended with the sword of truth, dismantling alliances with idolaters who repeatedly violated treaties. Others noted its close subject proximity to Surah Al-Anfal.\n* **The Psychology of the Earth Constricting (Verse 118):** Ka'b ibn Malik recounted: After confessing his procrastination, the Prophet ﷺ commanded total social silence. No one would return his salam. His closest cousin, Abu Qatadah, turned his face away. Ka'b said: *“The earth seemed unfamiliar to me, as though it were not the land I had lived in all my life.”* Ibn Kathir explains: When a believer falls into sin, the entire cosmos feels alienated until they reconcile with Allah.\n* **He Turned to Them that They Might Repent (*Thumma taba 'alayhim li-yatubu*):** The exquisite theological insight: Allah first turns to the servant with grace, opening their heart to feel remorse, so that the servant can then turn back to Him in repentance. Repentance begins with Allah's initiative, not our self-sufficiency.", "passages": "1. **Divine Companionship in the Cave (9:40):**  \n   <div class='arabic-block'>إِلَّا تَنصُرُوهُ فَقَدْ نَصَرَهُ اللَّهُ إِذْ أَخْرَجَهُ الَّذِينَ كَفَرُوا ثَانِيَ اثْنَيْنِ إِذْ هُمَا فِي الْغَارِ إِذْ يَقُولُ لِصَاحِبِهِ لَا تَحْزَنْ إِنَّ اللَّهَ مَعَنَا</div>  \n   *\"If you do not aid the Prophet—Allah has already aided him when those who disbelieved had driven him out [of Makkah] as one of two, when they were in the cave and he said to his companion, 'Do not grieve; indeed Allah is with us.'\"*\n2. **The Constriction and Pardon of the Three (9:118):**  \n   <div class='arabic-block'>وَعَلَى الثَّلَاثَةِ الَّذِينَ خُلِّفُوا حَتَّىٰ إِذَا ضَاقَتْ عَلَيْهِمُ الْأَرْضُ بِمَا رَحُبَتْ وَضَاقَتْ عَلَيْهِمْ أَنفُسُهُمْ وَظَنُّوا أَن لَّا مَلْجَأَ مِنَ اللَّهِ إِلَّا إِلَيْهِ ثُمَّ تَابَ عَلَيْهِمْ لِيَتُوبُوا ۚ إِنَّ اللَّهَ هُوَ التَّوَّابُ الرَّحِيمُ</div>  \n   *\"And [He forgave] the three who were left behind, until the earth, vast as it is, was constricted upon them and their souls were constricted upon them, and they realized that there is no refuge from Allah except to Him. Then He turned to them in mercy that they might repent. Indeed, Allah is the Accepting of repentance, the Merciful.\"*\n3. **The Command to Stand with the Truthful (9:119):**  \n   <div class='arabic-block'>يَا أَيُّهَا الَّذِينَ آمَنُوا اتَّقُوا اللَّهَ وَكُونُوا مَعَ الصَّادِقِينَ</div>  \n   *\"O you who have believed, fear Allah and be with those who are truthful.\"*\n4. **The Compassionate Nature of the Messenger ﷺ (9:128):**  \n   <div class='arabic-block'>لَقَدْ جَاءَكُمْ رَسُولٌ مِّنْ أَنفُسِكُمْ عَزِيزٌ عَلَيْهِ مَا عَنِتُّمْ حَرِيصٌ عَلَيْكُم بِالْمُؤْمِنِينَ رَءُوفٌ رَّحِيمٌ</div>  \n   *\"There has certainly come to you a Messenger from among yourselves. Grievous to him is what you suffer; [he is] concerned over you, and to the believers is kind and merciful.\"*", "dua": ""}, {"num": 10, "name": "Yunus", "arabic": "يونس", "classification": "Makki", "verses": 109, "theme": "Deliverance from darkness, transient parable of worldly life, and Quran as healing for the breasts", "why": "Surah Yunus is the sanctuary of hope for souls enveloped in suffocating darkness. Named after Prophet Yunus (Jonah, peace be upon him), whose famous cry from the triple darkness of night, ocean, and the belly of the whale brought immediate deliverance, this surah addresses the human experience of distress, doubt, and transience. It contains one of the most vivid warnings against consumerist materialism—describing worldly life as a lush garden wiped clean overnight—while offering the divine alternative: the Qur'an as an intimate heart-medicine (*shifā’un limā fiṣ-ṣudūr*) and an open invitation from Allah to the Eternal Home of Peace (*Dār as-Salām*). Completing Chapter 10 marks the foundational milestone of our 114-surah journey.", "action": "**Anchor the Dua of Yunus in Your Distress Today:**  \nWhenever you feel overwhelmed or trapped by worry today, pause, take a slow breath, and recite three times with complete presence:  \n$$\\text{لَّا إِلَٰهَ إِلَّا أَنتَ سُبْحَانَكَ إِنِّي كُنتُ مِنَ الظَّالِمِينَ}$$  \nFeel the weight of self-reliance lift from your shoulders.", "tadabbur": "* **The Belly of Your Own Whale:** Prophet Yunus found himself in three layers of suffocating darkness: the darkness of night, the depths of the black sea, and the enclosed stomach of a sea creature. In that moment, panic and despair were humanly natural. But instead of despairing, he whispered words of pure Tawhid and humility: *La ilaha illa Anta, subhanaka inni kuntu minaz-zalimin*.  \n  What is the darkness trapping you today? Chronic pain? Financial collapse? A broken relationship? The medicine has not changed in three thousand years. Turn your heart to Allah, acknowledge your human weakness, and watch the waves recede.\n* **What Are You Truly Rejoicing Over? (10:58):** We celebrate job promotions, new cars, and vacations. But when was the last time your heart felt genuine joy because you opened the Qur'an and understood a verse that healed your soul? Allah says: *In that let them rejoice; it is better than all the worldly goods they accumulate.*", "tafsir": "* **Healing for What Is in the Chests (*Shifa'un lima fis-sudur*):** Ibn Kathir and classical commentators note that this verse is universal (*Ya ayyuhan-nas*—addressed to all humanity). The sicknesses of the chest are of two kinds: spiritual doubts and intellectual skepticism (*shubuhat*), and destructive desires and emotional turbulence (*shahawat* and grief). The Qur'an cures both: its rational evidence clears doubts, while its spiritual reminders calm anxiety and instill inner peace (*sakinah*).\n* **The Exceptional Repentance of Nineveh (Verse 98):** Classical historians record that when the people of Yunus (the city of Nineveh) realized that their prophet had departed and divine clouds of punishment were gathering, they did not harden their hearts. The entire population—men, women, children, and even their cattle—walked out into the open fields, wept in collective remorse, and pleaded for mercy. Because their repentance was sincere before the final blow struck, Allah made them the only nation in history from whom collective destruction was lifted.", "passages": "1. **The Cosmic Balance of Sun and Moon (10:5):**  \n   <div class='arabic-block'>هُوَ الَّذِي جَعَلَ الشَّمْسَ ضِيَاءً وَالْقَمَرَ نُورًا وَقَدَّرَهُ مَنَازِلَ لِتَعْلَمُوا عَدَدَ السِّنِينَ وَالْحِسَابَ ۚ مَا خَلَقَ اللَّهُ ذَٰلِكَ إِلَّا بِالْحَقِّ</div>  \n   *\"It is He who made the sun a shining light and the moon a derived light and determined for it phases—that you may know the number of years and account [of time]. Allah has not created this except in truth.\"*\n2. **The Parable of the Fleeting World (10:24):**  \n   <div class='arabic-block'>إِنَّمَا مَثَلُ الْحَيَاةِ الدُّنْيَا كَمَاءٍ أَنزَلْنَاهُ مِنَ السَّمَاءِ فَاخْتَلَطَ بِهِ نَبَاتُ الْأَرْضِ مِمَّا يَأْكُلُ النَّاسُ وَالْأَنْعَامُ... أَتَاهَا أَمْرُنَا لَيْلًا أَوْ نَهَارًا فَجَعَلْنَاهَا حَصِيدًا كَأَن لَّمْ تَغْنَ بِالْأَمْسِ</div>  \n   *\"The example of [this] worldly life is like rain which We have sent down from the sky that the plants of the earth absorb—[those] from which men and livestock eat—until, when the earth has taken on its adornment and is beautified and its people think they have capability over it, there comes to it Our command by night or by day, and We make it as a harvest, as if it had not flourished yesterday.\"*\n3. **The Medicine for the Chests (10:57–58):**  \n   <div class='arabic-block'>يَا أَيُّهَا النَّاسُ قَدْ جَاءَتْكُم مَّوْعِظَةٌ مِّن رَّبِّكُمْ وَشِفَاءٌ لِّمَا فِي الصُّدُورِ وَهُدًى وَرَحْمَةٌ لِّلْمُؤْمِنِينَ (57) قُلْ بِفَضْلِ اللَّهِ وَبِرَحْمَتِهِ فَبِذَٰلِكَ فَلْيَفْرَحُوا هُوَ خَيْرٌ مِّمَّا يَجْمَعُونَ (58)</div>  \n   *\"O mankind, there has come to you instruction from your Lord and healing for what is in the breasts and guidance and mercy for the believers. Say, 'In the bounty of Allah and in His mercy—in that let them rejoice; it is better than whatever they accumulate.'\"*\n4. **The Exception of the People of Yunus (10:98):**  \n   <div class='arabic-block'>فَلَوْلَا كَانَتْ قَرْيَةٌ آمَنَتْ فَنَفَعَهَا إِيمَانُهَا إِلَّا قَوْمَ يُونُسَ لَمَّا آمَنُوا كَشَفْنَا عَنْهُمْ عَذَابَ الْخِزْيِ فِي الْحَيَاةِ الدُّنْيَا وَمَتَّعْنَاهُمْ إِلَىٰ حِينٍ</div>  \n   *\"Why was there not a single city that believed so its faith would have benefited it, except the people of Yunus? When they believed, We removed from them the punishment of disgrace in worldly life and gave them enjoyment for a time.\"*", "dua": ""}, {"num": 11, "name": "Hud", "arabic": "هود", "classification": "Makki", "verses": 123, "theme": "Uncompromising steadfastness (Istiqamah), the Deluge of Nuh, and good deeds erasing evil deeds", "why": "Surah Hud is the chapter that turned the beard of the Prophet Muhammad ﷺ grey. When Abu Bakr as-Siddiq asked him why he was aging, the Prophet ﷺ did not cite worldly hardships or political fatigue; he pointed directly to Surah Hud and its terrifying command: *“So stand firm and steadfast as you have been commanded”* (11:112). Surah Hud is the antidote to spiritual flabbiness. It takes the reader through the great catastrophic trials of human history—the Deluge of Nuh, the howling winds of 'Ad, the thunderous blast of Thamud—showing that no lineage, no status, and no wealth can save a person who abandons spiritual integrity.", "action": "**Erase a Recent Mistake with an Immediate Good Deed Today:**  \nIdentify one error or harsh word you spoke today. Immediately perform two actions: make sincere tawbah to Allah, and perform a deliberate good deed (give secret charity, recite two pages of Qur'an, or help someone in need) to activate verse 11:114.", "tadabbur": "* **What Mountain Are You Clinging To?** When financial anxiety, social upheaval, or personal illness threatens to engulf you: What is your instinctive sanctuary? Do you say, like Nuh's son: *‘I have my savings account, my connections, my career’*? Look at the world: empires fall, currencies devalue, bodies age. The son was on the highest peak, and the wave swallowed him in seconds. The only safe ground in the cosmos is aboard the Ark of obedience to Allah.\n* **The Cure for Stumbling (11:114):** Shaytan loves when a believer falls into sin and stays immobilized in shame for three weeks, abandoning prayer because they feel \"unworthy.\" Allah gives you the divine counter-attack: *Good deeds wipe away evil deeds.* When you slip: Stand up. Make wudu. Pray two rak'ahs. Give ten dollars in charity. Drown the mistake in an ocean of proactive goodness.", "tafsir": "* **Why Verse 11:112 Made Him Grey:** Ibn Abbas (رضي الله عنه) said: *\"No verse in the entire Qur'an descended upon the Messenger of Allah ﷺ that was heavier or more demanding than verse 11:112.\"* Allah commanded him: *Fastaqim kamā umirt*—not according to your emotions, your convenience, or public opinion, but strictly *as you were commanded*. Steadfastness without compromise while facing daily hostility requires superhuman spiritual energy.\n* **The Delusion of the Mountain (Verse 43):** Ibn Kathir points out the tragic psychology of Nuh’s son: when facing a cosmic flood that drowned the earth, the son placed his trust in a physical mountain (*Sa'awi ila jabalin ya'simuni*). He represents every modern materialist who believes bank accounts, insurance policies, or high walls can protect them when divine decree arrives. When the ocean rises, only the Ark of Faith floats.\n* **Not from Your Family (Verse 46):** When Nuh cried: *“My Lord, my son is of my family!”* Allah answered: *“He is not of your family; indeed, his conduct was unrighteous.”* Classical scholars emphasize that in the divine court, spiritual kinship outranks biological kinship. True brotherhood is defined by faith, not DNA.", "passages": "1. **The Ultimate Command of Steadfastness (11:112):**  \n   <div class='arabic-block'>فَاسْتَقِمْ كَمَا أُمِرْتَ وَمَن تَابَ مَعَكَ وَلَا تَطْغَوْا ۚ إِنَّهُ بِمَا تَعْمَلُونَ بَصِيرٌ</div>  \n   *\"So stand firm [on the straight path] as you have been commanded, you and those who have turned back with you, and do not transgress. Indeed, He is Seeing of what you do.\"*\n2. **The Cry Across the Waves (11:42–43):**  \n   <div class='arabic-block'>وَنَادَىٰ نُوحٌ ابْنَهُ وَكَانَ فِي مَعْزِلٍ يَا بُنَيَّ ارْكَب مَّعَنَا وَلَا تَكُن مَّعَ الْكَافِرِينَ (42) قَالَ سَآوِي إِلَىٰ جَبَلٍ يَعْصِمُنِي مِنَ الْمَاءِ ۚ قَالَ لَا عَاصِمَ الْيَوْمَ مِنْ أَمْرِ اللَّهِ إِلَّا مَن رَّحِمَ ۚ وَحَالَ بَيْنَهُمَا الْمَوْجُ فَكَانَ مِنَ الْمُغْرَقِينَ (43)</div>  \n   *\"And Noah called to his son who was apart, 'O my son! Embark with us and do not be with the disbelievers!' [The son] said, 'I will take refuge on a mountain; it will protect me from the water.' [Noah] said, 'There is no protector today from the decree of Allah, except for whom He has mercy.' And a wave surged between them, and he was among the drowned.\"*\n3. **Good Deeds Erasing Evil Deeds (11:114):**  \n   <div class='arabic-block'>وَأَقِمِ الصَّلَاةَ طَرَفَيِ النَّهَارِ وَزُلَفًا مِّنَ اللَّيْلِ ۚ إِنَّ الْحَسَنَاتِ يُذْهِبْنَ السَّيِّئَاتِ ۚ ذَٰلِكَ ذِكْرَىٰ لِلذَّاكِرِينَ</div>  \n   *\"And establish prayer at the two ends of the day and at the approach of the night. Indeed, good deeds wipe away evil deeds. That is a reminder for those who remember.\"*", "dua": ""}, {"num": 12, "name": "Yusuf", "arabic": "يوسف", "classification": "Makki", "verses": 111, "theme": "Subtle divine decree (Al-Latif), beautiful patience (Sabrun Jamil), and magnanimous forgiveness", "why": "Surah Yusuf is the Qur'an’s supreme masterpiece on emotional healing, divine providence, and the hidden mechanics of destiny. While human eyes see betrayal, abandonment, slavery, false accusation, and years of solitary imprisonment, Allah reveals that every single hardship was an essential stepping stone delivering Yusuf from the darkness of a desert well to the palace of Egypt. Surah Yusuf teaches us that no pain is wasted, no sincere prayer is lost, and that Allah’s subtle grace (*Lutf*) works silently beneath the surface of our darkest nights. For anyone carrying heartbreak, family betrayal, or years of unanswered supplication, Surah Yusuf is the divine promise that dawn is coming.", "action": "**Take Your Deepest Private Grief to Allah Tonight:**  \nIdentify the one sorrow, anxiety, or family heartache you have been carrying. In the quiet of the night, raise your hands and recite verse 12:86:  \n$$\\text{إِنَّمَا أَشْكُو بَثِّي وَحُزْنِي إِلَى اللَّهِ}$$  \nSpeak to Allah directly in your own words, telling Him everything without holding back.", "tadabbur": "* **The Well You Are Sitting In:** Are you currently sitting in a cold, dark well—betrayed by people you trusted, misunderstood, or trapped in circumstances you cannot control? Look at Yusuf (AS). In the well, he could not see Egypt. In prison, he could not see the palace. When your life looks broken, remember: Allah is still writing the chapter. The well is not your graveyard; it is your classroom.\n* **Complaining to the Creator, Not the Creation (12:86):** When tragedy strikes, our first instinct is to vent on social media, call four friends, and seek worldly validation. Ya'qub (AS) teaches us royal emotional dignity: *“I only complain of my suffering and grief to Allah.”* Human beings can give you pity, but only Allah can give you relief. Take your raw tears directly to the King.", "tafsir": "* **The Definition of *Sabrun Jamil* (Beautiful Patience):** Ibn Kathir and classical commentators define *Sabrun Jamil* as patience in which there is no complaining to creation. Ya'qub (peace be upon him) wept until his eyes turned white from grief, proving that shedding tears and feeling sorrow is natural and spiritually blameless; what is forbidden is complaining against Allah’s decree. He poured all his agony into the ear of Allah alone (*Innama ashku bath-thi wa huzni ila Allah*).\n* **The Name *Al-Latif* (The Subtle One, Verse 100):** Ibn al-Qayyim writes: Allah’s attribute of *Lutf* means He arranges outcomes through means so unexpected and gentle that human beings do not realize deliverance is happening until the story ends. Had Yusuf not been thrown into the well, the caravan would not have found him; had he not been sold into Egypt, he would not have entered the minister’s house; had he not been falsely accused, he would not have entered prison; had he not interpreted the prisoners’ dreams, Pharaoh would never have summoned him. Every disaster was a hidden mercy.\n* **The Prophetic Echo at Makkah (Verse 92):** When the Prophet Muhammad ﷺ conquered Makkah in 8 AH, standing before the Qurayshi chiefs who had murdered his family, tortured his companions, and driven him into exile, he asked: *“What do you think I will do with you today?”* They said: *“You are a noble brother, the son of a noble brother.”* He smiled and recited Yusuf’s exact words: *“No blame will there be upon you today. Go, for you are free.”*", "passages": "1. **The Declaration of Beautiful Patience (12:18, 12:83):**  \n   <div class='arabic-block'>فَصَبْرٌ جَمِيلٌ ۖ وَاللَّهُ الْمُسْتَعَانُ عَلَىٰ مَا تَصِفُونَ</div>  \n   *\"So patience is most fitting. And Allah is the one sought for help against that which you describe.\"*\n2. **The Sanctuary of Complaining to Allah Alone (12:86):**  \n   <div class='arabic-block'>قَالَ إِنَّمَا أَشْكُو بَثِّي وَحُزْنِي إِلَى اللَّهِ وَأَعْلَمُ مِنَ اللَّهِ مَا لَا تَعْلَمُونَ</div>  \n   *\"He said, 'I only complain of my suffering and my grief to Allah, and I know from Allah that which you do not know.'\"*\n3. **The Climax of Magnanimous Forgiveness (12:92):**  \n   <div class='arabic-block'>قَالَ لَا تَثْرِيبَ عَلَيْكُمُ الْيَوْمَ ۖ يَغْفِرُ اللَّهُ لَكُمْ ۖ وَهُوَ أَرْحَمُ الرَّاحِمِينَ</div>  \n   *\"He said, 'No blame will there be upon you today. May Allah forgive you; and He is the most merciful of the merciful.'\"*\n4. **The Ultimate Theological Realization (12:100):**  \n   <div class='arabic-block'>إِنَّ رَبِّي لَطِيفٌ لِّمَا يَشَاءُ ۚ إِنَّهُ هُوَ الْعَلِيمُ الْحَكِيمُ</div>  \n   *\"Indeed, my Lord is Subtle in [fulfilling] what He wills. Indeed, He is the Knowing, the Wise.\"*\n5. **The Ultimate Life Goal (12:101):**  \n   <div class='arabic-block'>تَوَفَّنِي مُسْلِمًا وَأَلْحِقْنِي بِالصَّالِحِينَ</div>  \n   *\"Cause me to die a Muslim and join me with the righteous.\"*", "dua": ""}, {"num": 13, "name": "Ar-Ra'd", "arabic": "الرعد", "classification": "Madani", "verses": 43, "theme": "Internal transformation triggering divine change, and tranquility in dhikr", "why": "Surah Ar-Ra'd is the great manifesto on spiritual reality versus sensory illusion. It takes its name from one of the most terrifying and majestic forces in nature—thunder—revealing that even the crashing lightning bolts that terrify humanity are engaged in humble glorification of the Creator (13:13). Surah Ar-Ra'd gives humanity the psychological master key to peace: in a world filled with roaring noise, transient trends, and political anxiety, human hearts are engineered with a specific spiritual vacuum that can never be satisfied by wealth, fame, or entertainment. As verse 28 resounds: *“Unquestionably, by the remembrance of Allah hearts are assured.”*", "action": "**Practice 5 Minutes of Silent \"Itmi'nan Dhikr\" Today:**  \nSit in a quiet space after your prayer. Close your eyes. Slowly recite:  \n$$\\text{سُبْحَانَ اللَّهِ ، وَالْحَمْدُ لِلَّهِ ، وَلَا إِلَٰهَ إِلَّا اللَّهُ ، وَاللَّهُ أَكْبَرُ}$$  \nWith each phrase, consciously pause, breathe, and let the majesty of the words settle into your chest until your heart feels still.", "tadabbur": "* **The Valley of Your Capacity (13:17):** Notice that Allah says: *“Valleys flow according to their capacity.”* A massive canyon holds a roaring river; a small ditch holds a shallow trickle. Both receive the same rain from the same sky. The Qur'an descends equally upon all of us. But how wide is your valley? Have you constricted your heart with trivia, jealousy, and social media drama so that it can only hold a few drops? Expand your capacity through humility and silence, and let revelation fill your depths.\n* **The Illusion of the Foam:** Look at modern internet culture: outrageous spectacles, viral controversies, fleeting fads. They swell up like *Zabad* (foam), screaming for attention. Two weeks later, no one remembers them. Surah Ar-Ra'd whispers to you: *Do not invest your life in foam.* Build what remains in the earth: sincere prayer, beneficial knowledge, righteous character, and quiet charity.", "tafsir": "* **The Parable of the Foam (*Zabad*, Verse 17):** Ibn Abbas and Ibn Kathir provide the profound classical breakdown of this metaphor: The rain descending from the sky is divine revelation (the Qur'an); the valleys are the hearts of human beings, each carrying revelation according to its spiritual capacity. When revelation enters a heart, it stirs up dormant doubts, desires, and worldly baggage, causing them to bubble to the surface like frothy scum on a flood. But just as the frothy foam quickly evaporates leaving behind pure, life-giving water that anchors into the soil, truth endures and bears fruit, while falsehood and doubts disappear into irrelevance.\n* **The Meaning of *Tatmainn* (Tranquility, Verse 28):** Imam al-Qurtubi and Ibn Kathir explain that *Itmi'nan* is not mere momentary relaxation; it is the absolute settling of the heart so that doubt is replaced by certainty, anxiety by trust, and restlessness by peace. The human soul was breathed into Adam from the divine spirit (*Ruh*); therefore, nothing originating from earthly soil (food, money, vanity) can ever truly nourish it. Only speech originating from the heavens (the Qur'an and Dhikr) can satisfy the soul.", "passages": "1. **The Divine Law of Internal Transformation (13:11):**  \n   <div class='arabic-block'>إِنَّ اللَّهَ لَا يُغَيِّرُ مَا بِقَوْمٍ حَتَّىٰ يُغَيِّرُوا مَا بِأَنفُسِهِمْ</div>  \n   *\"Indeed, Allah will not change the condition of a people until they change what is in themselves.\"*\n2. **The Parable of the Water and the Foam (13:17):**  \n   <div class='arabic-block'>أَنزَلَ مِنَ السَّمَاءِ مَاءً فَسَالَتْ أَوْدِيَةٌ بِقَدَرِهَا فَاحْتَمَلَ السَّيْلُ زَبَدًا رَّابِيًا... فَأَمَّا الزَّبَدُ فَيَذْهَبُ جُفَاءً ۖ وَأَمَّا مَا يَنفَعُ النَّاسَ فَيَمْكُثُ فِي الْأَرْضِ</div>  \n   *\"He sends down from the sky rain, and valleys flow according to their capacity, and the torrent carries a rising foam... As for the foam, it vanishes [being cast off]; but as for that which benefits the people, it remains in the earth.\"*\n3. **The Anchor of the Soul (13:28):**  \n   <div class='arabic-block'>الَّذِينَ آمَنُوا وَتَطْمَئِنُّ قُلُوبُهُم بِذِكْرِ اللَّهِ ۗ أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ</div>  \n   *\"Those who have believed and whose hearts are assured by the remembrance of Allah. Unquestionably, by the remembrance of Allah hearts are assured.\"*", "dua": ""}, {"num": 14, "name": "Ibrahim", "arabic": "إبراهيم", "classification": "Makki", "verses": 52, "theme": "The Parable of the Good Tree, gratitude vs ingratitude, and bringing people from darkness to light", "why": "Surah Ibrahim is the great architectural blueprint of gratitude (*Shukr*) and rooted faith. It defines the entire mission of divine revelation in its opening sentence: to rescue human civilization from the fragmented, suffocating darknesses (*az-zulumat*) of ignorance and bring them into the unified, serene Light (*an-Nur*) of divine guidance. It introduces the eternal mathematical formula of spiritual and material abundance: *“If you are grateful, I will surely increase you”* (14:7). Through the immortal Parable of the Good Tree and the intimate supplications of Prophet Ibrahim in the barren valley of Makkah, this surah shows that true legacies are built not with concrete, but with prayer, gratitude, and uncompromising devotion to Allah.", "action": "**Establish a \"Shukr Audit\" at Dinner or Bedtime Today:**  \nSit with your family or take out your journal tonight. Explicitly name three overlooked blessings from today (a healthy meal, a kind interaction, safety from harm) and say: *Alhamdulillah, All praise belongs to Allah Who granted this without my power or might.*", "tadabbur": "* **The Arithmetic of Gratitude (14:7):** How often do we complain about the 10% of life that feels difficult while completely ignoring the 90% that is functioning? You have clean water, eyesight, working lungs, and a roof over your head. Allah says: *If you count My favors, you could never enumerate them.* If you want more peace in your home, be grateful for what you have today. If you want more barakah in your wealth, give thanks for your current provision. Gratitude is the magnet for abundance.\n* **The Uprooted Tree (14:26):** Allah compares an evil word and an evil life to a tumbleweed uprooted from the surface of the earth (*ijtuthat min fawqil-ard ma laha min qarar*)—no roots, no stability, tossed around by every gust of wind. That is the soul living without revelation: unstable, fragile, anxious, reacting to every trend. Be the palm tree, not the tumbleweed.", "tafsir": "* **Darknesses in the Plural vs. Light in the Singular (Verse 1):** Classical mufassirun point out that *Az-Zulumat* (darknesses) is always plural in the Qur'an, whereas *An-Nur* (Light) is always singular. Falsehood, superstition, and materialism are splintered into hundreds of conflicting paths; but truth is one, unified, harmonious light emanating directly from the Creator.\n* **The Secret of *La'azidannakum* (Verse 7):** Ibn Kathir emphasizes that gratitude (*Shukr*) in Islam is not mere passive verbal thankfulness; it consists of three unified dimensions: heart acknowledgment, tongue praise, and bodily obedience (using the blessing to obey the Giver). When a servant uses health, wealth, and intellect in the service of Allah, Allah guarantees to increase both the blessing and the spiritual capacity to enjoy it.\n* **The Date Palm Metaphor (Verses 24–25):** In authentic hadiths, the Prophet ﷺ explained that the \"Good Tree\" is the date palm (*an-nakhlah*). Ibn al-Qayyim elaborates: The date palm has deep roots that drink from the water table, its trunk does not fall in storms, all of its parts are beneficial (leaves, fruit, trunk, shade), and its fruit is sweet and nourishing. Such is the believer whose heart is rooted in the Qur'an: wherever they go, they bring only benefit, peace, and sustenance to those around them.", "passages": "1. **The Purpose of Revelation (14:1):**  \n   <div class='arabic-block'>الر ۚ كِتَابٌ أَنزَلْنَاهُ إِلَيْكَ لِتُخْرِجَ النَّاسَ مِنَ الظُّلُمَاتِ إِلَى النُّورِ بِإِذْنِ رَبِّهِمْ إِلَىٰ صِرَاطِ الْعَزِيزِ الْحَمِيدِ</div>  \n   *\"[This is] a Book which We have revealed to you, [O Muhammad], that you might bring mankind out of darknesses into the light by permission of their Lord—to the path of the Exalted in Might, the Praiseworthy.\"*\n2. **The Unconditional Multiplier of Gratitude (14:7):**  \n   <div class='arabic-block'>وَإِذْ تَأَذَّنَ رَبُّكُمْ لَئِن شَكَرْتُمْ لَأَزِيدَنَّكُمْ ۖ وَلَئِن كَفَرْتُمْ إِنَّ عَذَابِي لَشَدِيدٌ</div>  \n   *\"And [remember] when your Lord proclaimed: 'If you are grateful, I will surely increase you [in favor]; but if you deny, indeed, My punishment is severe.'\"*\n3. **The Parable of the Good Tree (14:24–25):**  \n   <div class='arabic-block'>أَلَمْ تَرَ كَيْفَ ضَرَبَ اللَّهُ مَثَلًا كَلِمَةً طَيِّبَةً كَشَجَرَةٍ طَيِّبَةٍ أَصْلُهَا ثَابِتٌ وَفَرْعُهَا فِي السَّمَاءِ (24) تُؤْتِي أُكُلَهَا كُلَّ حِينٍ بِإِذْنِ رَبِّهَا</div>  \n   *\"Do you not see how Allah presents a parable: A good word is like a good tree, its root firmly fixed and its branches high in the sky? It produces its fruit at all times, by permission of its Lord.\"*\n4. **Ibrahim's Supplication for Prayer and Family (14:40–41):**  \n   <div class='arabic-block'>رَبِّ اجْعَلْنِي مُقِيمَ الصَّلَاةِ وَمِن ذُرِّيَّتِي ۚ رَبَّنَا وَتَقَبَّلْ دُعَاءِ (40) رَبَّنَا اغْفِرْ لِي وَلِوَالِدَيَّ وَلِلْمُؤْمِنِينَ يَوْمَ يَقُومُ الْحِسَابُ (41)</div>  \n   *\"My Lord, make me an establisher of prayer, and [many] from my descendants. Our Lord, and accept my supplication. Our Lord, forgive me and my parents and the believers the Day the account is established.\"*", "dua": ""}, {"num": 15, "name": "Al-Hijr", "arabic": "الحجر", "classification": "Makki", "verses": 99, "theme": "The Eternal Preservation of Divine Revelation (*Hifz al-Qur'an*), the Dignity of the Believer, and the Spiritual Cure for Grief and Mockery.", "why": "Surah Al-Hijr is the divine citadel of preservation and reassurance. In an era when cynics and mockers attacked the message of Islam, Allah issued the timeless guarantee that has guarded the Holy Qur'an letter-by-letter across fifteen centuries: 'Indeed, it is We who sent down the Quran and indeed, We will be its guardian' (15:9). It explores the creation of Adam from clay, the breathing of the divine Ruh, the arrogance of Iblis, and ends with the ultimate psychological cure for an aching, constricted chest: prostration, prayer, and certainty until death.", "action": "**Engage in a 5-Minute 'Sajdah of Relief' Today:**  \nWhen your day feels heavy or exhausting, make fresh wudu, turn to the Qiblah, and place your forehead on the floor in a long, unhurried prostration outside of obligatory prayers. Recite *Subhana Rabbiyal A'la* slowly, pour out your worries, and let your chest expand.", "tadabbur": "* **When Words Hurt Your Chest (15:97):** Notice the tender compassion of Allah: He does not tell the Prophet ﷺ, 'Stop feeling sensitive.' He says: *We know that your chest is constricted by what they say.* Allah validates the human pain of cruel words, betrayal, and slander. But then He hands you the medicine: Drop to your knees. Put your forehead on the floor. In prostration, your heart is closer to Allah than anywhere else on earth. Let the praise of Allah absorb the toxicity of human speech.\n* **The Treasury of All Things (15:21):** Allah tells you: Everything you desire—peace, wealth, health, clarity, companionship—exists in infinite, inexhaustible storehouses (*Khaza'in*) with Him. He withholds or releases it with precision (*bi-qadarin ma'lum*). If a door hasn't opened yet, it is not because the storehouse is empty; it is because the divine wisdom knows the exact hour when its arrival will nourish your soul rather than ruin it.", "tafsir": "* **The Immutability of the Qur'an (Verse 9):** Ibn Kathir notes that while previous scriptures (the Torah and Injeel) were entrusted to human custodians who altered and lost parts of them (per Surah 5:44), Allah Himself took personal, divine responsibility for preserving the Qur'an. Not a single vowel, letter, or word has been altered or lost across human history.\n* **The Therapy of Prostration (Verses 97–99):** Imam al-Qurtubi and Ibn Kathir highlight that Allah acknowledges the physical and psychological toll that hurtful, mocking words inflict on the human chest (*yadiqu sadruk*). The divine prescription given to the Prophet ﷺ is not counter-insults, social withdrawal, or anxiety; it is falling in prostration (*Sujud*) and exalting Allah (*Tasbih*), because connecting the forehead to the dust restores spiritual equilibrium.", "passages": "1. **The Absolute Divine Guarantee of Preservation (15:9):**  \n   <div class='arabic-block'>إِنَّا نَحْنُ نَزَّلْنَا الذِّكْرَ وَإِنَّا لَهُ لَحَافِظُونَ</div>  \n   *\"Indeed, it is We who sent down the Quran and indeed, We will be its guardian.\"*\n2. **The Creation of Adam and the Divine Breath (15:28–29):**  \n   <div class='arabic-block'>وَإِذْ قَالَ رَبُّكَ لِلْمَلَائِكَةِ إِنِّي خَالِقٌ بَشَرًا مِّن صَلْصَالٍ مِّنْ حَمَإٍ مَّسْنُونٍ ۝ فَإِذَا سَوَّيْتُهُ وَنَفَخْتُ فِيهِ مِن رُّوحِي فَقَعُوا لَهُ سَاجِدِينَ</div>  \n   *\"And [mention] when your Lord said to the angels, 'I will create a human being out of clay from an altered black mud. So when I have proportioned him and breathed into him of My [created] soul, then fall down in prostration to him.'\"*\n3. **The Divine Cure for a Constricted Heart (15:97–99):**  \n   <div class='arabic-block'>وَلَقَدْ نَعْلَمُ أَنَّكَ يَضِيقُ صَدْرُكَ بِمَا يَقُولُونَ ۝ فَسَبِّحْ بِحَمْدِ رَبِّكَ وَكُن مِّنَ السَّاجِدِينَ ۝ وَاعْبُدْ رَبَّكَ حَتَّىٰ يَأْتِيَكَ الْيَقِينُ</div>  \n   *\"And We
